name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check source and assets
        run: npm run check
      - name: Check game rules
        run: npm test
      - name: Build playable website
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
